<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smoke tests — The Initiate’s Hunt</title>
  <style>
    body { margin: 0; padding: 1.5rem; background: #eae6da; color: #21201c; font: .85rem/1.5 ui-monospace, Menlo, monospace; }
    h1 { font-size: 1rem; margin: 0 0 1rem; }
    #summary { font-weight: 700; margin-bottom: 1rem; }
    #summary.fail { color: #7a2e2a; }
    #summary.pass { color: #2f5d33; }
    ol { padding-left: 1.2rem; }
    li { margin: .25rem 0; }
    li.pass::marker { color: #2f5d33; }
    li.fail { color: #7a2e2a; }
    li.fail pre { white-space: pre-wrap; margin: .25rem 0 0; font: inherit; }
    iframe { width: 640px; height: 520px; border: 1px solid #c9c2ae; background: #fff; }
    details { margin-top: 1.5rem; }
  </style>
</head>

<body>
  <h1>Smoke tests</h1>
  <p id="summary">Running…</p>
  <ol id="results"></ol>

  <details>
    <summary>Game under test</summary>
    <iframe id="game" src="../index.html" title="Game under test"></iframe>
  </details>

  <script type="module" src="smoke.js"></script>
</body>

</html>
